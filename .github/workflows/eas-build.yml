name: Build Android APK with EAS

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile (development supports live testing)
        required: true
        default: preview
        type: choice
        options:
          - preview
          - development

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v3

      - name: 🏗 Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EAS_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Build app
        env:
          BUILD_PROFILE: ${{ inputs.profile }}
        run: eas build --platform android --non-interactive --profile "$BUILD_PROFILE"
